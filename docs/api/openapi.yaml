openapi: 3.1.0
info:
  title: Euron Open DataQuality
  description: "\nAPI of a self-hosted data quality platform: connect databases, upload files, point at\
    \ REST\nendpoints or push records; profile them, run checks inside the source, score the result,\n\
    keep the history, detect anomalies and alert.\n\n* People sign in with `POST /api/v1/auth/login` and\
    \ send the session token as\n  `Authorization: Bearer <token>` (the dashboard uses an HttpOnly cookie\
    \ instead).\n* Applications and CI use a project API key: `Authorization: Bearer dq_...` or\n  `X-API-Key:\
    \ dq_...`. Scopes: `read`, `scan`, `push`, `manage`.\n* `POST /api/v1/projects/{project_id}/datasets/{dataset_id}/scans?wait=60`\
    \ scans a dataset\n  and returns the result; `POST .../records` validates a batch of records.\n"
  version: 0.1.0
paths:
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Sign in to the dashboard
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      summary: Sign out
      description: 'Ends this session server-side too: the token is refused until it expires.'
      operationId: logout_api_v1_auth_logout_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ack'
  /api/v1/auth/session:
    get:
      tags:
      - auth
      summary: Who is signed in, if anyone
      description: 'For pages anyone may open (the problem list): a signed-out visitor is a normal

        answer here (200 with no user), not an error. ``/me`` stays strict (401) for API

        clients that require a session.'
      operationId: current_session_api_v1_auth_session_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionOut'
