components:
  schemas:
    Ack:
      properties:
        ok:
          type: boolean
          title: Ok
          default: true
        message:
          type: string
          title: Message
          default: ''
      type: object
      title: Ack
    AdminSettings:
      properties:
        site_name:
          type: string
          title: Site Name
        allow_signup:
          type: boolean
          title: Allow Signup
        ai_enabled:
          type: boolean
          title: Ai Enabled
        ai_base_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Ai Base Url
        ai_model:
          anyOf:
          - type: string
          - type: 'null'
          title: Ai Model
        ai_has_key:
          type: boolean
          title: Ai Has Key
      type: object
      required:
      - site_name
      - allow_signup
      - ai_enabled
      - ai_base_url
      - ai_model
      - ai_has_key
      title: AdminSettings
    AnomalyOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        dataset_id:
          type: string
          format: uuid
          title: Dataset Id
        scan_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Scan Id
        kind:
          type: string
          title: Kind
        metric:
          type: string
          title: Metric
        key:
          type: string
          title: Key
        value:
          anyOf:
          - type: number
          - type: 'null'
          title: Value
        expected:
          anyOf:
          - type: number
          - type: 'null'
          title: Expected
        z:
          anyOf:
          - type: number
          - type: 'null'
          title: Z
        direction:
          type: string
          title: Direction
        explanation:
          type: string
          title: Explanation
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - dataset_id
      - scan_id
      - kind
      - metric
      - key
      - value
      - expected
      - z
      - direction
      - explanation
      - created_at
      title: AnomalyOut
    ApiKeyCreate:
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 1
          title: Name
        scopes:
          items:
            type: string
            enum:
            - read
            - scan
            - push
            - manage
          type: array
          minItems: 1
          title: Scopes
      type: object
      required:
      - name
      title: ApiKeyCreate
    ApiKeyCreated:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        prefix:
          type: string
          title: Prefix
        scopes:
          items:
            type: string
          type: array
          title: Scopes
        last_used_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Used At
        revoked_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Revoked At
        created_at:
          type: string
          format: date-time
          title: Created At
        key:
          type: string
          title: Key
          description: Shown once. Store it now; only a hash is kept
      type: object
      required:
      - id
      - name
      - prefix
      - scopes
      - last_used_at
      - revoked_at
      - created_at
      - key
      title: ApiKeyCreated
    ApiKeyOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        prefix:
          type: string
          title: Prefix
        scopes:
          items:
            type: string
          type: array
          title: Scopes
        last_used_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Used At
        revoked_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Revoked At
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - name
      - prefix
      - scopes
      - last_used_at
      - revoked_at
      - created_at
