<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">Euron Open DataQuality</title>
  <desc id="d">Every bad record found, counted and watched, on your own servers: a self-hosted data quality platform that runs its checks inside your databases</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06101f"/>
      <stop offset="1" stop-color="#0b1d38"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b9cf0"/>
      <stop offset="1" stop-color="#1d64c8"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1d64c8" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#1d64c8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="16" fill="url(#grid)"/>
  <circle cx="1040" cy="160" r="200" fill="url(#halo)"/>

  <g font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="72" y="140" fill="#eef4ff" font-size="54" font-weight="650" letter-spacing="-1.2">Euron Open DataQuality</text>
    <text x="74" y="186" fill="#a9c6ef" font-size="22" font-weight="400">Every bad record found, counted and watched, on your own servers.</text>
    <text x="74" y="240" fill="#7ea3d6" font-size="16">PostgreSQL, MySQL, SQL Server, SQLite, files, REST  ·  checks run inside the source  ·  MIT</text>
  </g>

  <g transform="translate(900 60)" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <rect width="300" height="200" rx="14" fill="#0e2547"/>
    <text x="22" y="34" fill="#a9c6ef" font-size="13">Quality score</text>
    <text x="22" y="74" fill="#eef4ff" font-size="38" font-weight="650" letter-spacing="-0.8">96.4</text>
    <rect x="214" y="22" width="64" height="26" rx="13" fill="url(#mark)"/>
    <text x="246" y="40" fill="#ffffff" font-size="12" font-weight="650" text-anchor="middle">+2.1</text>

    <g font-size="12" fill="#a9c6ef">
      <text x="22" y="110">completeness</text>
      <rect x="120" y="100" width="156" height="10" rx="5" fill="#16335e"/>
      <rect x="120" y="100" width="152" height="10" rx="5" fill="#2a78d6"/>

      <text x="22" y="136">validity</text>
      <rect x="120" y="126" width="156" height="10" rx="5" fill="#16335e"/>
      <rect x="120" y="126" width="139" height="10" rx="5" fill="#eb6834"/>

      <text x="22" y="162">uniqueness</text>
      <rect x="120" y="152" width="156" height="10" rx="5" fill="#16335e"/>
      <rect x="120" y="152" width="155" height="10" rx="5" fill="#1baf7a"/>
    </g>
    <text x="22" y="188" fill="#7ea3d6" font-size="11" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace">email valid: 4 of 195 rows fail</text>
  </g>
</svg>
