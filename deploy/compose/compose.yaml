# Euron Open DataQuality: local stack (cloud-agnostic base).
#
# Never run this file alone. Pair it with a cloud overlay:
#   make up        # = compose.yaml + compose.floci.yaml  (emulated AWS, no account needed)
#   make up-aws    # = compose.yaml + compose.aws.yaml    (real AWS resources)
#
# Secrets come from deploy/compose/.env, generated by `make env`
# (scripts/gen-local-env.sh). They are random, local-only throwaways.
#
# Host ports (override in .env if they clash with something you already run):
#   web 4910   api 4930   mailpit 4925   mock AI and webhook sink 4950
#   postgres 4942   redis 4979   floci 4966
#   demo sources: postgres 4943, mysql 4906 (sql server 4933 with the mssql profile)
name: dataquality

x-server-build: &server-build
  context: ../../apps/api
  dockerfile: ../../infra/docker/server.Dockerfile

x-api-env: &api-env
  # Development mode keeps the production guards as warnings: the local stack talks to
  # an emulator and links to localhost, both of which production refuses on purpose.
  ENVIRONMENT: development
  DATAQUALITY_CLOUD: local
  LOG_LEVEL: ${DQ_LOG_LEVEL:-INFO}
  PORT: "8080"
  DATABASE_URL: postgresql+asyncpg://dataquality:dataquality@postgres:5432/dataquality
  REDIS_URL: redis://redis:6379/0
  SESSION_SECRET: ${SESSION_SECRET:?run `make env` first}
  API_KEY_PEPPER: ${API_KEY_PEPPER:?run `make env` first}
  LOCAL_MASTER_KEY: ${LOCAL_MASTER_KEY:?run `make env` first}
  KEY_MODE: local
  STORAGE: local
  LOCAL_STORAGE_DIR: /data/objects
  WORK_DIR: /data/work
  COOKIE_SECURE: "false"
  # The dashboard container proxies /api with X-Forwarded-For; trust it on the Compose
  # network. On AWS this is the VPC CIDR.
  FORWARDED_ALLOW_IPS: "*"
  CORS_ORIGINS: http://localhost:${DQ_WEB_PORT:-4910},http://127.0.0.1:${DQ_WEB_PORT:-4910}
  PUBLIC_URL: http://localhost:${DQ_WEB_PORT:-4910}
  # Alert emails land in Mailpit (http://localhost:4925).
  MAIL_BACKEND: smtp
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  # The demo's webhook channel posts to the sink in the mock service, a private address.
  OUTBOUND_ALLOW_PRIVATE: "true"
  # The demo replays 30 days of scans in a minute or two; production keeps the default 30.
  SCAN_RPM: "600"
  DQ_DEMO_PASSWORD: ${DQ_DEMO_PASSWORD:?run `make env` first}
  DQ_DEMO_AI_URL: http://mock-ai:4950/v1
  # The demo seed writes its source data with these (the app itself only gets read-only users).
  DQ_DEMO_SOURCE_PG_ADMIN: postgresql://warehouse_admin:${DQ_SOURCE_ADMIN_PASSWORD:?run `make env` first}@source-postgres:5432/warehouse
  DQ_DEMO_SOURCE_MYSQL_ADMIN: mysql://root:${DQ_SOURCE_ADMIN_PASSWORD:?run `make env` first}@source-mysql:3306/shop
  DQ_DEMO_READER_PASSWORD: ${DQ_READER_PASSWORD:?run `make env` first}

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: dataquality
      POSTGRES_USER: dataquality
      POSTGRES_PASSWORD: dataquality
    ports:
      - "127.0.0.1:${DQ_PG_PORT:-4942}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataquality -d dataquality"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Rate limits and the dashboard cache. Everything durable lives in Postgres.
  redis:
    image: redis:7.4.6-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${DQ_REDIS_PORT:-4979}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Demo source: a "warehouse" PostgreSQL that DataQuality checks through a read-only user.
  source-postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: warehouse
      POSTGRES_USER: warehouse_admin
      POSTGRES_PASSWORD: ${DQ_SOURCE_ADMIN_PASSWORD:?run `make env` first}
    ports:
      - "127.0.0.1:${DQ_SOURCE_PG_PORT:-4943}:5432"
    volumes:
      - sourcepg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse_admin -d warehouse"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Demo source: a "shop" MySQL.
  source-mysql:
    image: mysql:8.4.6
    environment:
      MYSQL_ROOT_PASSWORD: ${DQ_SOURCE_ADMIN_PASSWORD:?run `make env` first}
      MYSQL_DATABASE: shop
    command: ["--innodb-buffer-pool-size=128M", "--performance-schema=OFF"]
    ports:
      - "127.0.0.1:${DQ_SOURCE_MYSQL_PORT:-4906}:3306"
    volumes:
      - sourcemysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 3s
      timeout: 3s
      retries: 60

  # Optional SQL Server source (an amd64 image; on Apple silicon it runs under emulation).
  # make up MSSQL=1, or COMPOSE_PROFILES=mssql.
  source-mssql:
    image: mcr.microsoft.com/mssql/server:2022-CU20-ubuntu-22.04
    profiles: ["mssql"]
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DQ_MSSQL_SA_PASSWORD:-Dq-Sql-Server-1}
      MSSQL_PID: Developer
    ports:
      - "127.0.0.1:${DQ_SOURCE_MSSQL_PORT:-4933}:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60

  # Catches alert emails locally (SMTP 1025, web UI on 4925).
  mailpit:
    image: axllent/mailpit:v1.27.10
    ports:
      - "127.0.0.1:${DQ_MAILPIT_PORT:-4925}:8025"
    restart: unless-stopped

  # An OpenAI-compatible stand-in for the optional AI assistant, plus a webhook sink and a
  # demo REST endpoint (no key, no network).
  mock-ai:
    build:
      <<: *server-build
      target: api
    image: dataquality-api:local
    entrypoint: ["/usr/bin/tini", "--"]
    command: ["uvicorn", "mockai.app:app", "--host", "0.0.0.0", "--port", "4950"]
    ports:
      - "127.0.0.1:${DQ_MOCK_AI_PORT:-4950}:4950"
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:4950/healthz', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    image: dataquality-api:local
    command: ["migrate"]
    environment:
      <<: *api-env
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      mock-ai:
        condition: service_started
    restart: "no"

  api:
    image: dataquality-api:local
    command: ["serve", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      <<: *api-env
    ports:
      - "127.0.0.1:${DQ_API_PORT:-4930}:8080"
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001
    volumes:
      - objects:/data/objects
      - work:/data/work
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Runs scans (several at once), the scheduler, alert delivery and retention.
  worker:
    image: dataquality-api:local
    command: ["worker"]
    environment:
      <<: *api-env
      WORKER_CONCURRENCY: ${DQ_WORKER_CONCURRENCY:-4}
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001
    volumes:
      - objects:/data/objects
      - work:/data/work
    # The worker serves no HTTP: it is healthy while its metrics endpoint answers.
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9464/metrics', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../../apps/web
      dockerfile: ../../infra/docker/web.Dockerfile
    image: dataquality-web:local
    environment:
      API_INTERNAL_URL: http://api:8080
      PORT: "3000"
    ports:
      - "127.0.0.1:${DQ_WEB_PORT:-4910}:3000"
    read_only: true
    tmpfs:
      # The node user is uid 1000; Next writes its image cache under .next/cache.
      - /tmp:uid=1000,gid=1000
      - /app/.next/cache:uid=1000,gid=1000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  sourcepg:
  sourcemysql:
  objects:
  work:
